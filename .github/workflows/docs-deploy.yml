name: docs-deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '**/*.tf'
      - '.terraform-docs.yml'
      - 'README.md'
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - '.github/workflows/docs-deploy.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install docs dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-docs.txt

      - name: Generate terraform-docs
        uses: terraform-docs/gh-actions@v1.4.1
        with:
          working-dir: .
          output-file: README.md
          output-method: inject

      - name: Build MkDocs site
        run: python -m mkdocs build --strict

      - name: Check GitHub Pages configuration
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const { data } = await github.rest.repos.getPages({
                owner: context.repo.owner,
                repo: context.repo.repo,
              });

              const buildType = data.build_type || data?.build?.type;
              if (buildType && buildType !== 'workflow') {
                core.setFailed(
                  `GitHub Pages source is '${buildType}'. Set it to 'GitHub Actions' in Settings > Pages.`
                );
                return;
              }

              core.info('GitHub Pages is enabled and compatible with Actions deployment.');
            } catch (error) {
              if (error.status === 404) {
                core.setFailed(
                  "GitHub Pages is not enabled for this repository. Enable it in Settings > Pages and choose 'GitHub Actions' as source."
                );
                return;
              }
              throw error;
            }

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
